  apiVersion: apps/v1
  kind: Deployment                                                              
  metadata:                                                                     
    name: ingestion-service                                                     
  spec:                                                                         
    replicas: 1   
    selector:
      matchLabels:
        app: ingestion-service
    template:                                                                   
      metadata:
        labels:                                                                 
          app: ingestion-service
      spec:
        containers:
          - name: ingestion-service
            image: your-dockerhub-username/ingestion-service:latest
            env:
              - name: DATABASE_URL                                              
                valueFrom:
                  secretKeyRef:                                                 
                    name: app-secrets
                    key: DATABASE_URL
              - name: RABBITMQ_URL
                valueFrom:
                  secretKeyRef:
                    name: app-secrets
                    key: RABBITMQ_URL