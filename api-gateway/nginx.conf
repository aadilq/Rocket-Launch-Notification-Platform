events {}

http{
    resolver 127.0.0.11 valid=10s;

    server{
        listen 80;

        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
        }

        location ~ ^/api/(.*)$ {
            set $backend http://backend-api:8000;
            proxy_pass $backend/$1;
        }
    }
}